name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock?schema=public"

      - name: Run server tests
        run: npm test

      - name: Build server code
        run: npm run build

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm run test:run

      - name: Build client code
        run: npm run build

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    if: always()
    steps:
      - name: Ensure all required jobs succeeded
        run: |
          if [[ "${{ needs.build-server.result }}" != "success" || "${{ needs.build-client.result }}" != "success" ]]; then
            echo "One or more CI jobs failed or were cancelled. Merge is blocked."
            exit 1
          fi
          echo "All required CI jobs passed."